<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector | AI-Powered News Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-fake {
            background: #fee;
            border: 2px solid #f44336;
        }

        .result-real {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }

        .result-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .confidence-bar {
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
            height: 30px;
        }

        .confidence-fill {
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .confidence-fake {
            background: linear-gradient(90deg, #f44336, #ff9800);
        }

        .confidence-real {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 15px;
        }

        .stat-card {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .examples {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .example-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .example-btn {
            background: #f5f5f5;
            padding: 8px 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Fake News Detection System</h1>
            <p>AI-powered news verification using Machine Learning</p>
        </div>
        
        <div class="content">
            <div class="input-section">
                <label>📝 Enter News Article Text:</label>
                <textarea id="newsText" rows="8" placeholder="Paste or type the news article here...&#10;&#10;Example: &#10;Breaking: Scientists discover revolutionary cure for common cold! The new treatment, developed by local researchers, shows 100% effectiveness in preliminary trials..."></textarea>
                
                <div class="button-group">
                    <button class="btn-predict" onclick="predictNews()">🔍 Detect Fake News</button>
                    <button class="btn-clear" onclick="clearText()">🗑️ Clear</button>
                </div>
            </div>
            
            <div id="result" class="result-section"></div>
            <div id="error" class="error"></div>
            
            <div class="examples">
                <label>📚 Try Examples:</label>
                <div class="example-buttons">
                    <button class="example-btn" onclick="loadExample('fake')">📰 Fake News Example</button>
                    <button class="example-btn" onclick="loadExample('real')">✅ Real News Example</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function predictNews() {
            const newsText = document.getElementById('newsText').value;
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            
            // Validate input
            if (!newsText.trim() || newsText.trim().length < 20) {
                showError('Please enter at least 20 characters of news text');
                return;
            }
            
            // Show loading state
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div style="text-align: center;"><div class="loader"></div> Analyzing news article...</div>';
            resultDiv.className = 'result-section';
            errorDiv.style.display = 'none';
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ news_text: newsText })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResult(data);
                } else {
                    showError(data.error || 'Something went wrong');
                }
            } catch (error) {
                showError('Network error. Make sure the server is running.');
            }
        }
        
        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            const isFake = data.result === 'FAKE';
            
            resultDiv.className = `result-section ${isFake ? 'result-fake' : 'result-real'}`;
            
            resultDiv.innerHTML = `
                <div class="result-header">
                    ${isFake ? '⚠️ LIKELY FAKE NEWS' : '✅ LIKELY REAL NEWS'}
                </div>
                <div>Confidence: <strong>${data.confidence}%</strong></div>
                <div class="confidence-bar">
                    <div class="confidence-fill ${isFake ? 'confidence-fake' : 'confidence-real'}" 
                         style="width: ${data.confidence}%">
                        ${data.confidence}%
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Fake Probability</div>
                        <div class="stat-value" style="color: #f44336;">${data.fake_probability}%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Real Probability</div>
                        <div class="stat-value" style="color: #4caf50;">${data.real_probability}%</div>
                    </div>
                </div>
                <div style="margin-top: 15px; font-size: 14px; color: #666;">
                    💡 This prediction is based on an AI model with 99% accuracy
                </div>
            `;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function clearText() {
            document.getElementById('newsText').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
        
        function loadExample(type) {
            if (type === 'fake') {
                document.getElementById('newsText').value = "BREAKING: Scientists discover that drinking lemon water cures COVID-19 in just 24 hours! A local health guru claims that the natural remedy is 1000% more effective than vaccines. The pharmaceutical industry is hiding this information to sell expensive drugs. Share this news with everyone you know before they delete it!";
            } else {
                document.getElementById('newsText').value = "NASA successfully launched the Artemis I mission on Wednesday, sending an uncrewed Orion spacecraft around the moon. The Space Launch System rocket lifted off from Kennedy Space Center at 1:47 a.m. EST. This mission marks the first step in returning humans to the lunar surface by 2025.";
            }
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
